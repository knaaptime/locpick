name: test
channels:
  - conda-forge
dependencies:
  - python>=3.14
  # core
  - numpy
  - pandas
  - scipy
  - formulaic>=0.5
  - numba>=0.59
  - xarray
  - lazy_loader
  # optional (spatial)
  - libpysal>=4.0
  - geopandas>=0.13
  - scikit-learn>=1.2
  - livelike
  - geosnap
  - duckdb < 1.5
  - pymedm
  - optimagic
  - optimistix
  - nlopt
  - optax
  - scikit-sparse
  - pip
  - pip:
    - klujax
    - cholgraph
    - jax>=0.4


  # testing
  - codecov
  - coverage
  - pytest>=7
  - pytest-cov
  - pytest-xdist
  # docs
  - numpydoc
  - nbsphinx
  - myst-parser
  - sphinx>=7
  - sphinx-autodoc2
  - sphinxcontrib-bibtex
  - sphinx-copybutton
  - sphinx-immaterial
  - myst-nb
  - watermark